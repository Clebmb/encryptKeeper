[package]
name = "encryptkeeper"
version = "1.0.0"
description = "encryptKeeper Professional: OpenPGP and S/MIME desktop workspace for notes, files, certificates, and hardware tokens"
authors = ["Codex"]
edition = "2021"

[lib]
name = "encryptkeeper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "1"
walkdir = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
